<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-100">

  <script src="src/core/icons.js"></script>
  <script src="src/core/store.js"></script>

  <script src="src/data/options.js"></script>
  <script src="src/data/seed.js"></script>

  <script src="src/shell/sidebar.js"></script>

  <script src="src/features/customer/store-form.js"></script>
  <script src="src/features/customer/store-history.js"></script>

  <script src="src/app.js"></script>

</html>
